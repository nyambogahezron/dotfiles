# ~/.tmux.conf 

#  General ─

# Set prefix to Ctrl+Space (more ergonomic)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Better colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase history limit
set -g history-limit 100000

# Fix escape delay (essential for Vim)
set -s escape-time 0

#  Keybindings 

# Use Vim keys in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-begin-selection
bind-key -T copy-mode-vi y send-copy-selection-and-cancel

# Vim-style pane switching
# (Compatible with vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easy split panes (using current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

#  Plugins (TPM) 

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

#  Theme (Catppuccin) ─

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

#  Initialize TPM 
# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
