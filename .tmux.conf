#  TMUX QUICK REFERENCE (Default Key Bindings)
# ==============================================
# Prefix key: Ctrl+B (press this before any shortcut)
#
# PANES:
#   Ctrl+B %       - Split horizontally (left/right)
#   Ctrl+B "       - Split vertically (top/bottom)
#   Ctrl+B arrow   - Switch between panes
#   Ctrl+B Ctrl+arrow - Resize panes
#   Ctrl+B z       - Maximize/minimize current pane
#   Ctrl+B x       - Close current pane
#
# WINDOWS:
#   Ctrl+B c       - Create new window
#   Ctrl+B n/p     - Next/previous window
#   Ctrl+B 0-9     - Switch to window by number
#   Ctrl+B ,       - Rename current window
#   Ctrl+B &       - Close current window
#
# SESSIONS:
#   Ctrl+B d       - Detach from session
#   Ctrl+B s       - Switch sessions
#   Ctrl+B $       - Rename current session
#   Ctrl+B (       - Previous session
#   Ctrl+B )       - Next session
#
# COPY MODE:
#   Ctrl+B [       - Enter copy mode
#   q             - Exit copy mode
#   v             - Start selection (vi mode)
#   y             - Copy selection to clipboard
#
# OTHER:
#   Ctrl+B ?       - List all key bindings
#   Ctrl+B :       - Command prompt
#   Ctrl+B t       - Show clock

#  General Settings
# Shell and terminals
#set -g default-shell /bin/zsh
# set -g default-terminal "kitty"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:Tc"

# Usability
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -s escape-time 0            # Remove delay for ESC in Neovim
set -g history-limit 1000000    # Large history
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update status bar every 3s
set -g allow-passthrough on     # Allow image previews
set -g status-position top      # Status bar at the top

#  Keybindings (Default tmux bindings)
# Prefix: Ctrl+B (default)
set -g prefix C-b
bind C-b send-prefix

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Split panes (default bindings)
# Ctrl+B % = horizontal split (left/right)
# Ctrl+B " = vertical split (top/bottom)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (default arrow keys)
# Ctrl+B + arrow keys to switch panes
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# Pane resizing (default Ctrl+arrow keys)
# Ctrl+B + Ctrl+arrow keys to resize panes
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5

# Maximize/minimize pane (default)
bind z resize-pane -Z

# Copy mode (vi-style)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

#  Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

#  Theme (Catppuccin)
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

#  Appearance overrides (merged from Nord preferences)
set -g status-style "bg=#3b4252,fg=#eceff4"
set -g status-left "#[fg=#81a1c1,bold]  󰒋 #S "
set -g status-right "#[fg=#88c0d0]   %H:%M #[fg=#81a1c1]  󰃭 %d-%b-%y "
set -g window-status-current-format "#[fg=#a3be8c,bold] #I:#W* "
set -g window-status-format "#[fg=#81a1c1] #I:#W "
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
