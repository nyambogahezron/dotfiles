#  General Settings
# Shell and terminals
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:Tc"

# Usability
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -s escape-time 0            # Remove delay for ESC in Neovim
set -g history-limit 1000000    # Large history
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update status bar every 3s
set -g allow-passthrough on     # Allow image previews
set -g status-position top      # Status bar at the top

#  Keybindings
# Set prefix to Ctrl+Space (more ergonomic)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config (both locations supported)
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Easy splits (using current path)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in CWD
bind c new-window -c "#{pane_current_path}"

# Vim-style pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Vim-style pane switching (compatible with vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Maximize pane
bind -r m resize-pane -Z

# Vi-mode for copy-mode (copy to system clipboard)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

#  Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

#  Theme (Catppuccin)
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

#  Appearance overrides (merged from Nord preferences)
set -g status-style "bg=#3b4252,fg=#eceff4"
set -g status-left "#[fg=#81a1c1,bold] 󰒋 #S "
set -g status-right "#[fg=#88c0d0]  %H:%M #[fg=#81a1c1] 󰃭 %d-%b-%y "
set -g window-status-current-format "#[fg=#a3be8c,bold] #I:#W* "
set -g window-status-format "#[fg=#81a1c1] #I:#W "
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
