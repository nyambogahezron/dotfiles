name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y stow zsh shellcheck

      - name: Validate shell scripts
        run: shellcheck setup/**/*.sh .devcontainer/setup.sh

      - name: Validate Gitattributes
        run: |
          if [ -f .gitattributes ]; then
            echo "✅ .gitattributes present"
          fi

      - name: Check stow compatibility
        run: stow --no --verbose -t "$HOME" . 2>&1 || true

      - name: Validate devcontainer JSON
        run: |
          python3 -c "import json; json.load(open('.devcontainer/devcontainer.json'))"
          echo "✅ devcontainer.json is valid JSON"

  install-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y stow git curl

      - name: Run minimal setup
        run: |
          bash setup/main.sh --minimal 2>&1 | head -50 || true

      - name: Verify dotfiles are stowable
        run: |
          stow --no --verbose -t /root . 2>&1
          echo "✅ All dotfiles are valid"
