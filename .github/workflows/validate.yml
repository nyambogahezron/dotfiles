name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck stow

      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r shellcheck --severity=error

      - name: Test setup previews
        run: bash tests/setup-dry-run.sh

      - name: Check Stow links
        run: |
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          HOME="$target" make check
