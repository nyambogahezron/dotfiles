name: Validate Dotfiles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck stow

      - name: Syntax check shell scripts
        run: |
          find . -name "*.sh" -o -name "*.zsh" | xargs -I {} bash -n {}

      - name: ShellCheck
        run: |
          find . -name "*.sh" | grep -v "dotfiles-legacy" | xargs shellcheck

      - name: Validate Stow application (dry-run)
        run: |
          # Simulate stowing to a temporary directory to verify structure
          mkdir -p /tmp/home
          stow -v -d . -t /tmp/home --ignore="install.sh|Makefile|README.md|LICENSE|AGENTS.md|Brewfile|docs|scripts|setup|dotfiles-legacy" .
