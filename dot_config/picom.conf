# ~/.config/picom.conf — managed by chezmoi

#  Backend ─
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;

#  Shadows ─
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.7;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

#  Opacity ─
active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'Brave-browser'",
    "100:class_g = 'firefox'",
    "90:class_g = 'kitty'",
    "90:class_g = 'code-oss'",
    "90:class_g = 'Code'"
];

#  Fading 
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

#  Corners ─
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#  Blur 
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

#  Wintypes 
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
    dock = { shadow = false; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.8; }
    dropdown_menu = { opacity = 0.8; }
};
