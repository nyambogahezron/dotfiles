# ~/.config/aerospace/aerospace.toml — managed by chezmoi
# i3-like tiling window manager for macOS

# ── General ───────────────────────────────────────────────────────────────────
start-at-login = true

# ── Keybindings ───────────────────────────────────────────────────────────────
[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

alt-enter = 'exec-and-forget open -a Ghostty'

# ── Gaps ──────────────────────────────────────────────────────────────────────
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10
