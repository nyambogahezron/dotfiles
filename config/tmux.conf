#  Tmux Configuration 
# Prefix: Ctrl+Space (ergonomic, avoids conflicts with Vim)

#  Core Settings ──

# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Set terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase history limit
set -g history-limit 50000

# Reduce ESC delay (important for Neovim)
set -sg escape-time 10

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable focus events (for Neovim)
set-option -g focus-events on

#  Key Bindings 

# Reload config
bind r source-file ~/.tmux.conf \; display-message "✓ Config reloaded"

# Split panes with | and -  (intuitive: | is vertical split, - is horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

#  Vi Mode ──

# Enable Vi mode for copy mode
set-window-option -g mode-keys vi

# Vi-style copy mode bindings
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# Enter copy mode with Prefix+[
bind [ copy-mode

#  Vim-like Pane Navigation 
# Use Ctrl+hjkl to switch panes without prefix (works with vim-tmux-navigator)

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with Prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#  Window Navigation ─

# Shift+Arrow to switch windows without prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt+number to jump to window directly
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

#  Status Bar ──

# Catppuccin Mocha palette
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Status bar position and update interval
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left

# Status bar colors
set -g status-style "bg=${thm_bg},fg=${thm_fg}"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=${thm_blue},fg=${thm_black},bold] 󱄅 #S #[bg=${thm_bg},fg=${thm_blue}]"

# Right: host + time
set -g status-right-length 60
set -g status-right "#[fg=${thm_black4}]#[bg=${thm_black4},fg=${thm_fg}] %H:%M #[bg=${thm_black4},fg=${thm_blue}]#[bg=${thm_blue},fg=${thm_black},bold]  #h "

# Window tabs
set -g window-status-format "#[bg=${thm_bg},fg=${thm_black4}] #I #[fg=${thm_fg}]#W "
set -g window-status-current-format "#[bg=${thm_gray},fg=${thm_blue},bold] #I #[fg=${thm_fg}]#W#{?window_zoomed_flag, 󰊓,} "

# Pane borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Message style
set -g message-style "bg=${thm_yellow},fg=${thm_black},bold"
set -g message-command-style "bg=${thm_blue},fg=${thm_black}"

#  TPM Plugins ─

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect: restore Neovim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save sessions every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
