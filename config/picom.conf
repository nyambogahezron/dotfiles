# Picom Configuration for Blur Effects

# Backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;

# Blur
blur: {
  method = "dual_kawase";
  strength = 8;
  background = false;
  background-frame = false;
  background-fixed = false;
}

# Blur rules for specific applications
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity rules
opacity-rule = [
  "95:class_g = 'code-oss'",
  "95:class_g = 'Code'",
  "90:class_g = 'brave-browser'",
  "90:class_g = 'Brave-browser'",
  "85:class_g = 'kitty'"
];

# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.5;

# Window type settings
wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
