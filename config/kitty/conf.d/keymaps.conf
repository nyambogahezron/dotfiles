# vim:fileencoding=utf-8:foldmethod=marker

#: Keyboard shortcuts {{{

#: Custom function key mappings for window management

# F1: Create new window with current working directory
map f1 new_window_with_cwd

# F2: Open Helix editor in current directory  
map f2 launch --cwd=current /usr/bin/hx .

# F3: Create new tab
map f3 new_tab_with_cwd

# F4: Smart split (auto horizontal/vertical based on window size)
map f4 launch --location=split --cwd=current

# F5: Horizontal split (window above/below)
map f5 launch --location=hsplit --cwd=current

# F6: Vertical split (window left/right)
map f6 launch --location=vsplit --cwd=current

# F7: Close current window
map f7 close_window

# F8: Close current tab
map f8 close_tab

#: Additional convenient shortcuts

# Ctrl+Shift+Enter: Quick new window
map ctrl+shift+enter new_window_with_cwd

# Ctrl+Shift+T: New tab
map ctrl+shift+t new_tab_with_cwd

# Ctrl+Shift+W: Close window
map ctrl+shift+w close_window

# Ctrl+Shift+Q: Close tab
map ctrl+shift+q close_tab

# Alt+Enter: Smart split
map alt+enter launch --location=split --cwd=current

# Alt+H: Horizontal split
map alt+h launch --location=hsplit --cwd=current

# Alt+V: Vertical split
map alt+v launch --location=vsplit --cwd=current

#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.

# kitty_mod ctrl+shift

#: Remove all shortcut definitions up to this point. Useful, for
#: instance, to remove the default shortcuts.

# clear_all_shortcuts no

#: Define action aliases to avoid repeating the same options in
#: multiple mappings.

# action_alias launch_tab launch --type=tab --cwd=current

#: Example additional shortcuts (commented out by default)

#: Clipboard
# map kitty_mod+c copy_to_clipboard
# map kitty_mod+v paste_from_clipboard

#: Scrolling
# map kitty_mod+up    scroll_line_up
# map kitty_mod+down  scroll_line_down
# map kitty_mod+page_up scroll_page_up
# map kitty_mod+page_down scroll_page_down

#: Window management
# map kitty_mod+enter new_window
# map kitty_mod+w close_window
# map kitty_mod+] next_window
# map kitty_mod+[ previous_window

#: Tab management
# map kitty_mod+right next_tab
# map kitty_mod+left previous_tab
# map kitty_mod+t new_tab
# map kitty_mod+q close_tab

#: Layout management
# map kitty_mod+l next_layout

#: Font sizes
# map kitty_mod+equal  change_font_size all +2.0
# map kitty_mod+minus  change_font_size all -2.0
# map kitty_mod+backspace change_font_size all 0

#: Miscellaneous
# map kitty_mod+f11 toggle_fullscreen
# map kitty_mod+f2 edit_config_file
# map kitty_mod+f5 load_config_file

#: }}}
