# vim:fileencoding=utf-8:foldmethod=marker

#: Kitty Terminal Configuration
#: ============================
#:
#: This is the main configuration file for Kitty terminal.
#: It includes all the modular configuration files organized
#: by functionality.
#:
#: To customize any aspect of Kitty, edit the appropriate
#: file in the conf.d/ directory.

#: Font Configuration {{{
include conf.d/fonts.conf
#: }}}

#: Layout and Window Management {{{
include conf.d/layouts.conf
#: }}}

#: Appearance and Visual Settings {{{
include conf.d/appearance.conf
#: }}}

#: Keyboard Shortcuts {{{
include conf.d/keymaps.conf
#: }}}

#: Color Theme {{{
#: The current theme is defined in current-theme.conf
#: To change themes, edit that file or create new themes
#: in the themes/ directory
include current-theme.conf
#: }}}

#: Session Configuration {{{
#: Startup session with complex layout
#: Comment out or modify the path to disable/change the startup session
startup_session session.kitty.conf
#: }}}

#: SSH Configuration {{{
#: SSH-specific settings for remote connections
include ssh.conf
#: }}}
