# ~/.config/starship.toml
# Powerlevel10k Rainbow Clone for Starship
# Recreates the classic P10k aesthetic with exact ANSI colors and right-prompt support.

format = """
[ $os ](bg:white fg:black)\
[](bg:blue fg:white)\
$directory\
[](bg:green fg:blue)\
$git_branch\
$git_status\
[](fg:green)\
\n$character"""

right_format = """
[](fg:cyan)\
$c\
$golang\
$nodejs\
$rust\
[](bg:cyan fg:black)\
$time\
"""

[os]
disabled = false
style = "bg:white fg:black"

[os.symbols]
Ubuntu = " "
Macos = " "
Linux = " "
Arch = " "
Debian = " "

[directory]
style = "bg:blue fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:green fg:black"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:green fg:black"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:cyan fg:black"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:black fg:white"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
