# ~/.config/starship.toml

format = """
\n$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$time\
$jobs\
$cmd_duration\
$status\
$line_break\
$line_break\
$character"""

add_newline = true
palette = "nord"

[os]
disabled = false
style = "fg:white bold"
format = "[$symbol]($style) "

[os.symbols]
Ubuntu = " "
Macos = " "
Linux = " "
Arch = " "
Debian = " "
Fedora = " "
Alpine = " "

[username]
show_always = false
style_user = "fg:cyan bold"
style_root = "fg:red bold"
format = "[󰀉 $user]($style) "

[hostname]
ssh_only = true
style = "fg:purple bold"
format = "@[$hostname]($style) "

[directory]
style = "bold fg:dark_blue"
format = "[󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = "󰇄 "

[git_branch]
style = "fg:green"
symbol = " "
format = "[on](white) [$symbol$branch ]($style)"

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style) )"
ahead = "󰶣${count}"
behind = "󰶡${count}"
diverged = "󰹹"
untracked = "󰇘"
stashed = "󰀼"
modified = "󰏬"
staged = "󰐕"
renamed = "󰕤"
deleted = "󰗨"

[fill]
symbol = "·"
style = "fg:gray"

[python]
style = "teal"
symbol = "󰌠 "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ""

[lua]
style = "blue"
symbol = "󰢱 "
format = "[$symbol($version )]($style)"

[nodejs]
style = "blue"
symbol = "󰎙 "
format = "[$symbol($version )]($style)"

[golang]
style = "blue"
symbol = "󰟓 "
format = "[$symbol($version )]($style)"

[haskell]
style = "blue"
symbol = "󰲒 "
format = "[$symbol($version )]($style)"

[rust]
style = "orange"
symbol = "󱘗 "
format = "[$symbol($version )]($style)"

[ruby]
style = "blue"
symbol = "󰴭 "
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "fg:gray"
format = "[$symbol$version]($style) "

[aws]
symbol = "󰸏 "
style = "yellow"
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = "󰡨 "
style = "fg:#06969A"
format = "[$symbol]($style) $path"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_extensions = ["Dockerfile"]

[jobs]
symbol = "󱖐 "
style = "red"
number_threshold = 1
format = "[$symbol]($style)"

[cmd_duration]
min_time = 500
style = "fg:gray"
format = "[$duration]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:black fg:white"
format = "[  $time ]($style)"

[status]
disabled = false
format = "[$symbol]($style) "
symbol = "󰅙 "
success_symbol = "󰄬 "
style = "fg:gray"
map_symbol = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.nord]
dark_blue = "#5E81AC"
blue = "#81A1C1"
teal = "#88C0D0"
red = "#BF616A"
orange = "#D08770"
green = "#A3BE8C"
yellow = "#EBCB8B"
purple = "#B48EAD"
gray = "#434C5E"
black = "#2E3440"
white = "#D8DEE9"

[palettes.onedark]
dark_blue = "#61afef"
blue = "#56b6c2"
red = "#e06c75"
green = "#98c379"
purple = "#c678dd"
cyan = "#56b6c2"
orange = "#be5046"
yellow = "#e5c07b"
gray = "#828997"
white = "#abb2bf"
black = "#2c323c"
