# ~/.config/tmux/tmux.conf

# ── General Settings ──────────────────────────────────────────────────────────
set -g default-shell /bin/zsh
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for ESC in Neovim
set -g history-limit 1000000    # Large history
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update status bar every 3s
set -g allow-passthrough on     # Allow image previews
set -g status-position top      # Status bar at the top

# ── Keybindings ───────────────────────────────────────────────────────────────
# Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Splits in CWD
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window in CWD
bind c new-window -c "#{pane_current_path}"

# Vim-style pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane
bind -r m resize-pane -Z

# Vi-mode for copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ── Appearance (Nord) ─────────────────────────────────────────────────────────
set -g status-style "bg=#3b4252,fg=#eceff4"
set -g status-left "#[fg=#81a1c1,bold] 󰒋 #S "
set -g status-right "#[fg=#88c0d0]  %H:%M #[fg=#81a1c1] 󰃭 %d-%b-%y "
set -g window-status-current-format "#[fg=#a3be8c,bold] #I:#W* "
set -g window-status-format "#[fg=#81a1c1] #I:#W "
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"
