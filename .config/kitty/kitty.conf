# vim:fileencoding=utf-8:foldmethod=marker
# Kitty Terminal — Single-file configuration
# github.com/nyambogahezron/dotfiles

# Fonts

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0

# Enable font ligatures (great for coding)
disable_ligatures never

# Nerd Font symbol map for icons (Powerline, Devicons, etc.)
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

# Cursor

cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback

scrollback_lines 20000

# Mouse

mouse_hide_wait 3.0

url_color #89b4fa
url_style curly

# Open URLs with Ctrl+click
open_url_with default

# Performance

repaint_delay 10
input_delay 3
sync_to_monitor yes

# Window

remember_window_size  yes
initial_window_width  1280
initial_window_height 800

window_padding_width  12

# Remove native window decorations (use compositor/WM for borders)
hide_window_decorations yes

# Don't ask for confirmation when closing the window
confirm_os_window_close 0

# Background opacity (requires compositor like Picom on X11)
background_opacity 0.90

# Blur the background content beneath the window (kitty 0.28+)
# background_blur 20

# Subtle tint when no background image is set
background_tint 0.0

# Layouts

# Available layouts: fat, grid, horizontal, splits, stack, tall, vertical
enabled_layouts splits,tall,stack

# Window borders (visible when multiple panes are open)
window_border_width  1pt
draw_minimal_borders no
window_margin_width  8
single_window_margin_width 0

# Active window border color (Catppuccin Mocha blue)
active_border_color   #89b4fa
inactive_border_color #313244
bell_border_color     #f38ba8

# Tab Bar

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        1

active_tab_font_style   bold
inactive_tab_font_style normal

# Tab title: show window number and title
tab_title_template      "{index}: {title}"

# Shell & Editor

# Use default user shell
shell .

# Editor launched by ctrl+shift+F2
editor nvim

# Shell integration: OSC 133 prompts, cwd tracking, etc.
shell_integration enabled

# Remote Control

# Needed for kitten @ commands and scripting kitty externally
allow_remote_control yes
listen_on unix:/tmp/kitty

# Clipboard

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Hyperlinks

allow_hyperlinks yes

# Bell

enable_audio_bell no
visual_bell_duration 0.0

# Color Scheme
# Dynamically load the current theme
include themes/nord.conf

# Keyboard Shortcuts

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# Scrolling
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map page_up          scroll_page_up
map page_down        scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# Window / Pane management
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w     close_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# Vim-style pane focus
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Splits (like tmux)
map alt+shift+v launch --location=vsplit --cwd=current
map alt+shift+h launch --location=hsplit --cwd=current

# Tab management
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+q     close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+,     move_tab_backward
map ctrl+shift+.     move_tab_forward

# Alt+N to jump to tab N
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Layout switching
map ctrl+shift+space next_layout

# Font size
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Miscellaneous
map ctrl+shift+f11   toggle_fullscreen
map ctrl+shift+f2    edit_config_file
map ctrl+shift+f5    load_config_file
map ctrl+shift+/     show_scrollback

# Launch URL selector with hints kitten
map ctrl+shift+e     open_url_with_hints

# URL hints (open URLs in browser via keyboard)
map ctrl+shift+p>u   kitten hints

# SSH / Session

# Startup session (comment out to disable)
# startup_session session.kitty.conf
