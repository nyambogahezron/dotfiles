# Kitty Terminal Configuration

# Background blur and transparency
background_opacity 0.85
background_blur 20

# Dynamic background opacity (optional - allows changing opacity with keyboard shortcuts)
dynamic_background_opacity yes

# Font settings
font_family JetBrains Mono
font_size 12.0

# Color scheme (optional - you can customize this)
# These are some nice transparent-friendly colors
foreground #ffffff
background #1a1a1a
cursor #ffffff

# Window settings
window_padding_width 10
window_margin_width 0

# Tab settings
tab_bar_edge bottom
tab_bar_style powerline

# Performance settings
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell settings
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
url_color #0087bd
url_style curly

# Keyboard shortcuts for changing opacity (optional)
map ctrl+shift+equal change_opacity +0.1
map ctrl+shift+minus change_opacity -0.1
map ctrl+shift+0 set_opacity 1.0
